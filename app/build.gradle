plugins {
    alias(libs.plugins.android.application)
}

// 本机配置（local.properties 已被 .gitignore 排除）：TMDb Key 与可选 API 域名
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def tmdbApiKey = localProperties.getProperty('tmdb.api.key', '').trim()
def tmdbBaseUrl = localProperties.getProperty('tmdb.base.url', 'https://api.themoviedb.org/3/').trim()
if (!tmdbBaseUrl.endsWith('/')) {
    tmdbBaseUrl = tmdbBaseUrl + '/'
}

android {
    namespace 'com.chenzhe.movietracker'
    compileSdk = 37

    defaultConfig {
        applicationId "com.chenzhe.movietracker"
        minSdk = 26
        targetSdk = 37
        versionCode = 1
        versionName = "0.1.0"

        // TMDb 配置经 BuildConfig 注入：Key 本身只存在于本机 local.properties，不会入库
        buildConfigField "String", "TMDB_API_KEY", "\"${tmdbApiKey}\""
        buildConfigField "String", "TMDB_BASE_URL", "\"${tmdbBaseUrl}\""

        // Room 导出 schema 需要该参数（后续建库时生效）
        javaCompileOptions {
            annotationProcessorOptions {
                arguments["room.schemaLocation"] = "$projectDir/schemas".toString()
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        // AGP 9 默认关闭 BuildConfig，从这一步开始需要通过它读取 TMDb 配置
        buildConfig = true
    }
}

dependencies {
    // AndroidX 基础
    implementation libs.androidx.core
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.recyclerview

    // Jetpack
    implementation libs.androidx.lifecycle.runtime
    implementation libs.androidx.lifecycle.viewmodel
    implementation libs.androidx.lifecycle.livedata
    implementation libs.androidx.room.runtime
    annotationProcessor libs.androidx.room.compiler
    implementation libs.androidx.work.runtime

    // 网络
    implementation platform(libs.okhttp.bom)
    implementation libs.retrofit
    implementation libs.retrofit.converter.gson
    implementation libs.okhttp
    implementation libs.okhttp.logging.interceptor

    // 图片加载
    implementation libs.glide
    annotationProcessor libs.glide.compiler

    // 测试
    testImplementation libs.junit
}
